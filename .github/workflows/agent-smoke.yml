name: Ferrol AI Smoke Test
on:
  push:
    branches:
      - feat/ai-agent-mvp
    paths:
      - '.github/workflows/agent-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call agent smoke endpoint
        run: |
          set -e
          response=$(curl -fsS https://ypegwpoykntbpburndjf.supabase.co/functions/v1/agent-smoke)
          echo "$response"
          echo "$response" | grep '"ok":true'
