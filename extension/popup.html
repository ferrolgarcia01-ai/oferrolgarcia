<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferrol AI Developer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">FERROL <span>AI</span></div>
        <div class="subtitle">Developer Agent</div>
      </div>
      <span id="subscriptionBadge" class="badge muted">Verificando...</span>
    </header>

    <section id="authView" class="view">
      <div class="hero">
        <h1>Crie pelo chat.<br/>O GitHub vira o código.</h1>
        <p>Entre com sua conta para acessar seus projetos e o agente.</p>
      </div>
      <form id="loginForm" class="card stack">
        <label>E-mail<input id="email" type="email" autocomplete="email" required /></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" type="submit">Entrar</button>
        <button id="signupBtn" class="secondary" type="button">Criar conta</button>
        <p id="authError" class="error"></p>
      </form>
    </section>

    <section id="workspaceView" class="view hidden">
      <div class="status-grid">
        <button id="githubConnectBtn" class="integration-card">
          <span class="dot" id="githubDot"></span>
          <span><strong>GitHub</strong><small id="githubStatus">Não conectado</small></span>
          <b>Conectar</b>
        </button>
        <button id="supabaseInfoBtn" class="integration-card">
          <span class="dot on"></span>
          <span><strong>Ferrol Cloud</strong><small>Conta e agente</small></span>
          <b>Ativo</b>
        </button>
      </div>

      <div class="project-row">
        <label for="projectSelect">Projeto</label>
        <select id="projectSelect"><option value="">Conecte o GitHub primeiro</option></select>
      </div>

      <section id="chat" class="chat">
        <div class="message assistant">Olá! Escolha um projeto e me diga o que quer criar ou alterar.</div>
      </section>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="3" placeholder="Ex.: Crie uma landing page premium igual à imagem que vou enviar..."></textarea>
        <div class="composer-actions">
          <label class="attach">📎<input id="imageInput" type="file" accept="image/*" hidden /></label>
          <button id="sendBtn" class="primary" type="submit">Enviar</button>
        </div>
        <div id="attachmentName" class="attachment-name"></div>
      </form>

      <footer>
        <button id="logoutBtn" class="link">Sair</button>
        <span id="userEmail"></span>
      </footer>
    </section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
